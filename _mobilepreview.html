<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#2b2b2b;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:0;padding:0}
 .lbl{color:#ddd;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:10px 0 6px}
 .phone{width:390px;height:760px;border:0;background:#000;display:block;box-shadow:0 0 0 8px #111}
</style></head><body>
 <div class="lbl" id="lbl">PAGE</div>
 <iframe class="phone" id="f" src=""></iframe>
 <script>
   const p = new URLSearchParams(location.search).get('p') || '/';
   document.getElementById('f').src = p;
   document.getElementById('lbl').textContent = p;
 </script>
</body></html>

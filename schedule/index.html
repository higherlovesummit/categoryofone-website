<!DOCTYPE html>
<html lang="en" class="page-schedule">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Your Call | Category of One Branding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=20261103c" />
  <style>
    html.page-schedule,
    html.page-schedule body {
      margin: 0;
      background: #000 !important;
      color: #fff !important;
    }
    html.page-schedule body {
      min-height: 100vh;
    }
    html.page-schedule,
    html.page-schedule *,
    html.page-schedule *::before,
    html.page-schedule *::after {
      box-sizing: border-box;
    }
    .schedule {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 40px 48px 72px;
      text-align: center;
    }
    .schedule-logo {
      display: inline-block;
      line-height: 0;
    }
    .schedule-logo img {
      height: 54px;
      width: auto;
      display: block;
    }
    html.page-schedule body h1 {
      color: #fff !important;
      font-size: clamp(34px, 3.6vw, 52px) !important;
      max-width: 18ch;
      margin: 32px auto 40px;
    }
    .schedule-cal {
      background: #fff;
      width: 100%;
    }
    .schedule-cal iframe {
      display: block;
      width: 100%;
      height: 760px;
      border: 0;
    }
    @media (max-width: 700px) {
      .schedule {
        width: 100%;
        padding: 28px 0 0;
      }
      .schedule-logo img {
        height: 44px;
      }
      .schedule-logo,
      html.page-schedule body h1 {
        padding-left: 24px;
        padding-right: 24px;
      }
      html.page-schedule body h1 {
        max-width: none;
        margin-top: 24px;
        margin-bottom: 28px;
        font-size: clamp(30px, 8.4vw, 40px) !important;
      }
      .schedule-cal iframe {
        height: 1080px;
      }
    }
  </style>
</head>
<body>
  <main class="schedule">
    <a class="schedule-logo" href="/"><img src="/SVG/COB_Reverse.svg" alt="Category of One Branding" /></a>
    <h1>Now, please schedule your call below.</h1>
    <div class="schedule-cal"><iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2-yerGEpaIHMthKMw7eSFMZG5ovJ_je-ow2xnaCDe6ZXjh9s7-JdBkDElvGri_OphhdREU2NZx?gv=true" title="Schedule your Category of One Brand Consultation" loading="eager"></iframe></div>
  </main>
</body>
</html>
